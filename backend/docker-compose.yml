version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: dental-clinic-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: dental-clinic
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - dental-network

  # Redis Cache (for sessions and caching)
  redis:
    image: redis:7-alpine
    container_name: dental-clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dental-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental-clinic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/dental-clinic?authSource=admin
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    networks:
      - dental-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  dental-network:
    driver: bridge
