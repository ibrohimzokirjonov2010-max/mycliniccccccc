<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="shifo-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="35%" stop-color="#1499AD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shifo-glass-512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shifo-glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#shifo-grad-512)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="10" />
  
  <!-- Glass Highlight Top -->
  <rect x="32" y="32" width="448" height="224" rx="110" fill="url(#shifo-glass-512)" />

  <!-- Emblem Shape (Tooth & Vital Heart Care Fusion) -->
  <g filter="url(#shifo-glow-512)">
    <!-- Tooth Outer Contour -->
    <path 
      d="M256 112 C181 112 139 149 139 203 C139 248 160 293 176 341 C189 379 208 400 227 400 C243 400 248 379 256 352 C264 379 269 400 285 400 C304 400 323 379 336 341 C352 293 373 248 373 203 C373 149 331 112 256 112 Z" 
      fill="#FFFFFF" 
      fill-opacity="0.98"
    />

    <!-- Inlay Heart & Care Emblem in Cyan/Deep Teal -->
    <path 
      d="M256 173 C237 148 197 158 197 195 C197 227 256 272 256 272 C256 272 315 227 315 195 C315 158 275 148 256 173 Z" 
      fill="#0E7490" 
      fill-opacity="0.92"
    />

    <!-- Center Medical Spark -->
    <circle cx="256" cy="201" r="17" fill="#FFFFFF" />
  </g>

  <!-- Top-Right Sparkle Diamond Accent -->
  <path d="M395 91 L406 123 L438 134 L406 145 L395 177 L384 145 L352 134 L384 123 Z" fill="#FFFFFF" fill-opacity="0.95" />
</svg>
