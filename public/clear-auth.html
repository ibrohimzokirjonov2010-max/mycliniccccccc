<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Auth Clear</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #dc2626;
    }
    button.success {
      background: #22c55e;
    }
    button.success:hover {
      background: #16a34a;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 Clinic Authentication Clear</h1>
    <p>Brauzeringizdagi autentifikatsiya ma'lumotlarini tozalash uchun tugmani bosing:</p>
    
    <button onclick="clearAuth()">Barcha ma'lumotlarni tozalash</button>
    <button class="success" onclick="checkStatus()">Holatni tekshirish</button>
    <button onclick="location.href='/'">Saytga o'tish</button>
    
    <div class="status" id="status"></div>
  </div>

  <script>
    function clearAuth() {
      // Clear all auth-related localStorage items
      localStorage.removeItem('is_authenticated');
      localStorage.removeItem('admin_auth');
      localStorage.removeItem('user_id');
      localStorage.removeItem('user_name');
      localStorage.removeItem('user_role');
      localStorage.removeItem('clinic_id');
      localStorage.removeItem('current_clinic_id');
      
      alert('Autentifikatsiya ma\'lumotlari o\'chirildi! Sahifa yangilanadi...');
      window.location.reload();
    }

    function checkStatus() {
      const status = document.getElementById('status');
      const authData = {
        'is_authenticated': localStorage.getItem('is_authenticated'),
        'admin_auth': localStorage.getItem('admin_auth'),
        'user_id': localStorage.getItem('user_id'),
        'user_name': localStorage.getItem('user_name'),
        'user_role': localStorage.getItem('user_role'),
        'clinic_id': localStorage.getItem('clinic_id'),
        'current_clinic_id': localStorage.getItem('current_clinic_id')
      };
      
      let html = '<strong>Hozirgi holat:</strong><br><br>';
      for (const [key, value] of Object.entries(authData)) {
        html += `${key}: ${value ? '✅ ' + value : '❌ null'}<br>`;
      }
      
      const isLoggedIn = authData['is_authenticated'] || authData['admin_auth'];
      html += '<br><strong>' + (isLoggedIn ? '🔓 Tizimga kirilgan' : '🔑 Login sahifasi ko\'rsatiladi') + '</strong>';
      
      status.innerHTML = html;
    }

    // Auto-check on load
    checkStatus();
  </script>
</body>
</html>
